apiVersion: apps/v1
kind: Deployment
metadata:
  name: alif-frontend
  namespace: alif
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alif-frontend
  template:
    metadata:
      labels:
        app: alif-frontend
    spec:
      containers:
        - name: alif-frontend
          image: cyrinegaaloul/alif-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
