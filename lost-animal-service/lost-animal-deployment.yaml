apiVersion: apps/v1
kind: Deployment
metadata:
  name: lost-animal-service
  namespace: alif
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lost-animal-service
  template:
    metadata:
      labels:
        app: lost-animal-service
    spec:
      containers:
        - name: lost-animal-service
          image: cyrinegaaloul/lost-animal-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
          envFrom:
            - configMapRef:
                name: lost-animal-service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: lost-animal-uploads
              mountPath: /app/uploads/lost-animals
          startupProbe:
            tcpSocket:
              port: 8088
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: lost-animal-uploads
          emptyDir: {}
