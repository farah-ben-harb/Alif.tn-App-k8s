apiVersion: v1
kind: ConfigMap
metadata:
  name: street-reporting-config
  namespace: alif
data:
  ALIF_APP_DB_NAME: Alif.tn-app
  DB_URL: jdbc:mysql://mysql:3306/Alif.tn-app?createDatabaseIfNotExist=true
  DB_USERNAME: alif
  EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
  ALLOWED_ORIGINS: http://192.168.1.172:30080
  APP_UPLOAD_DIR: /app/uploads
  ANIMAL_DETECTION_URL: http://animal-detection-service:8000/detect
