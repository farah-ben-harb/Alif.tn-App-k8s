apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: alif
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: cyrinegaaloul/discovery-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: http
          startupProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 6
