apiVersion: v1
kind: ConfigMap
metadata:
  name: intervention-service-config
  namespace: alif
data:
  ALIF_APP_DB_NAME: Alif.tn-app
  DB_URL: jdbc:mysql://mysql:3306/Alif.tn-app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  DB_USERNAME: root
  EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
  INTERVENTION_AI_ENABLED: "false"
  INTERVENTION_ATTACHMENTS_PATH: /app/uploads/interventions
